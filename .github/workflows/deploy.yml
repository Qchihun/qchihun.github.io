name: Deploy Hexo Blog

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      # ⚠️ 重点修改：即使你本地是 v24，云端也固定降级到 v16，确保 Hexo 能跑
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.x' 
          
      - name: 安装依赖
        run: npm install
        
      # ⚠️ 加一步：强制升级个关键渲染插件，避免报错
      - name: 准备环境并生成
        run: |
          npm install hexo-renderer-marked@6.0.0 --save
          npx hexo generate
        
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
