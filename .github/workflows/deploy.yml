name: Deploy Hexo Blog

on:
  push:
    branches:
      - main  # 这里监听的是你的源码分支。根据你之前的截图，你的源码在 main 分支上。

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: 安装依赖
        run: npm install
        
      - name: 生成静态文件
        run: npx hexo generate
        
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master  # ⚠️ 这里改成了你想要部署到的 master 分支
          force_orphan: true      # 强制覆盖 master，只放生成的网页文件
